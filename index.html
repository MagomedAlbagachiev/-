<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mercedes-Benz</h1>
    <p>Люкс-класс от немецкого автопрома</p>
  </header>

  <div class="pulsating-circle"></div>

  <main>
    <section class="cars-grid">
      <div class="car-card">
        <img src="С63.WEBP" alt="Mercedes-Benz C-Class">
        <h3>C-Class</h3>
        <p>Простой купе нормальный для учебы</p>
        <div class="price">от 3 200 000 ₽</div>
        <button class="btn">Подробнее</button>
      </div>

      <div class="car-card">
        <img src="i.png" alt="Mercedes-Benz E-Class">
        <h3>E-Class</h3>
        <p>Достойный конкурент для ваз 2114.</p>
        <div class="price">от 4 500 000 ₽</div>
        <button class="btn">Подробнее</button>
      </div>

      <div class="car-card">
        <img src="12132" alt="Mercedes-Benz GLE">
        <h3>GLE</h3>
        <p>Лоам вудаш дик хул</p>
        <div class="price">от 4 100 000 ₽</div>
        <button class="btn">Подробнее</button>
      </div>

      <div class="car-card">
        <img src="sss" alt="Mercedes-Benz GLS">
        <h3>GLS</h3>
        <p>Подарить жене</p>
        <div class="price">от 6 800 000 ₽</div>
        <button class="btn">Подробнее</button>
      </div>
    </section>
  </main>

</body>
</html>
